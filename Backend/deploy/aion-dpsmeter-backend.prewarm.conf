# The server has about 200 disk operations per second (75 MB/s). SQLite reads a cold database in random 4 KB pieces (about 30 minutes for 1.4 GB); read
# in one run with big blocks it takes about 2-3 minutes (measured 8-12 MB/s). So the file is read once before the backend starts: it then sits in the
# file cache and the start, the first statistics run and the daily copy find it there. A failed read must not stop the start (leading "-").
[Service]
ExecStartPre=-/bin/dd if=/opt/dpsmeter/Backend/data/dpsmeter.sqlite of=/dev/null bs=4M status=none
ExecStartPre=-/bin/dd if=/opt/dpsmeter/Backend/data/dpsmeter.sqlite-wal of=/dev/null bs=4M status=none
TimeoutStartSec=900
