name: Tests

# Runs on every push to main and on every pull request, so the result is public on the repository page:
# the type check and all backend tests (the upload checks, the matching, the pacing against the NC server, the SEO pages ...).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend type check and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Backend/pnpm-lock.yaml
      - name: Install the dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: pnpm test

  client:
    name: Client build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build Client/AionDPS.csproj -c Release --nologo
