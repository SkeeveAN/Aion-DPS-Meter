name: Build and attach the installer to a release

# Runs on every "vX.Y.Z" tag push (the normal release flow) and can also be triggered
# manually for a tag that already exists (workflow_dispatch) -- needed the first time this
# workflow is added, since GitHub evaluates a tag-push trigger using the workflow file that
# existed AT that tag's commit, so tags created before this file existed never fire it on
# their own.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach the installer to (e.g. v0.5.3)"
        required: true

permissions:
  contents: write

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Derive version from tag
        id: version
        shell: bash
        # MSI ProductVersion must be plain major.minor.build (each under its own numeric limit,
        # see ICE24/ICE80's sibling ICE for the exact caps) with no prerelease label -- strip
        # everything from the first "-" onward so a tag like "v1.0.0-beta.1" still produces a
        # valid "1.0.0" rather than failing the MSI build entirely.
        #
        # A tag with a suffix ("v1.0.0-alpha.1") is a pre-release for testers: it is packed under its full
        # semantic version on its own Velopack channel ("alpha"), so installed stable clients (channel
        # "win") never see it as an update, it is never marked "Latest", and the final 1.0.0 stays free.
        run: |
          version="${TAG#v}"
          full="$version"
          version="${version%%-*}"
          echo "number=$version" >> "$GITHUB_OUTPUT"
          if [ "$full" != "$version" ]; then
            echo "pack=$full" >> "$GITHUB_OUTPUT"
            echo "channel=alpha" >> "$GITHUB_OUTPUT"
            echo "pre=true" >> "$GITHUB_OUTPUT"
          else
            echo "pack=$version" >> "$GITHUB_OUTPUT"
            echo "channel=win" >> "$GITHUB_OUTPUT"
            echo "pre=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ steps.tag.outputs.name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish AionDPS (win-x64, self-contained)
        run: >
          dotnet publish Client/AionDPS.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false -o publish

      - name: Install the Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.0

      # Delta packages are built by diffing against the previous release, so the previous release
      # has to be on disk before packing -- with an empty output directory every release would be
      # a full ~70 MB download for everyone. Allowed to fail: the very first Velopack release has
      # nothing to fetch, and a missed delta only costs bandwidth, never correctness.
      #
      # --pre because every release of this project is marked prerelease; without it this finds
      # nothing, exactly like GitHub's own /releases/latest endpoint.
      - name: Fetch the previous release (for delta packages)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --channel ${{ steps.version.outputs.channel }} --pre true --token $env:GH_TOKEN --outputDir releases
        shell: pwsh

      # Produces, in "releases": the installer (AionDpsMeter-win-Setup.exe), a full .nupkg, a
      # delta .nupkg when a previous release was fetched above, and releases.win.json -- the index
      # the installed app reads to discover updates. Velopack's GithubSource resolves all of them
      # by asset name from the GitHub release, so they must be attached to it.
      - name: Build the Velopack release
        run: >
          vpk pack
          --packId AionDpsMeter
          --packTitle "Aion DPS Meter"
          --packAuthors SkeeveAN
          --packVersion ${{ steps.version.outputs.pack }}
          --packDir publish
          --mainExe "Aion DPS.exe"
          --icon Client/assets/app/aiondps.ico
          --channel ${{ steps.version.outputs.channel }}
          --outputDir releases

      # Scans the installer with VirusTotal before anything is attached to the release. Skipped when
      # the VT_API_KEY secret is not set. An unreachable VirusTotal never blocks a release (warning
      # only); a verdict does: 5 or more malicious/suspicious engines, or any of the big vendors
      # listed below, fails the job so the installer is never published. A handful of hits from
      # small engines is normal for a new unsigned program that reads network traffic -- those are
      # only reported. The report link ends up in the release notes (see the attach step).
      - name: Scan the installer with VirusTotal
        id: vt
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          INSTALLER: releases/AionDpsMeter-${{ steps.version.outputs.channel }}-Setup.exe
        shell: pwsh
        run: |
          if (-not $env:VT_API_KEY) { Write-Host "VT_API_KEY not set, skipping the VirusTotal scan."; exit 0 }
          $bigVendors = @('Microsoft', 'Kaspersky', 'ESET-NOD32', 'BitDefender', 'Sophos', 'Symantec', 'McAfee', 'CrowdStrike', 'Avast', 'AVG')
          $headers = @{ 'x-apikey' = $env:VT_API_KEY }
          $report = $null
          try {
            $uploadUrl = (Invoke-RestMethod -Uri 'https://www.virustotal.com/api/v3/files/upload_url' -Headers $headers).data
            $analysisId = (Invoke-RestMethod -Uri $uploadUrl -Method Post -Headers $headers -Form @{ file = Get-Item $env:INSTALLER }).data.id
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Seconds 30
              $a = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/analyses/$analysisId" -Headers $headers
              if ($a.data.attributes.status -eq 'completed') { $report = $a; break }
            }
          } catch {
            Write-Host "::warning::VirusTotal scan failed, the release continues without it: $($_.Exception.Message)"
            exit 0
          }
          if (-not $report) { Write-Host "::warning::VirusTotal analysis did not finish in time, the release continues without it."; exit 0 }

          $stats = $report.data.attributes.stats
          $hits = [int]$stats.malicious + [int]$stats.suspicious
          $total = $hits + [int]$stats.harmless + [int]$stats.undetected
          $sha = $report.meta.file_info.sha256
          $link = "https://www.virustotal.com/gui/file/$sha"
          $flagged = @($report.data.attributes.results.PSObject.Properties.Value |
            Where-Object { $_.category -in 'malicious', 'suspicious' } | ForEach-Object { $_.engine_name })
          $big = @($flagged | Where-Object { $bigVendors -contains $_ })

          "link=$link" >> $env:GITHUB_OUTPUT
          "result=$hits/$total" >> $env:GITHUB_OUTPUT
          $summary = "### VirusTotal: $hits / $total engines flag the installer`n$link"
          if ($flagged) { $summary += "`nFlagged by: " + ($flagged -join ', ') }
          $summary >> $env:GITHUB_STEP_SUMMARY
          Write-Host $summary

          if ($hits -ge 5 -or $big.Count -gt 0) {
            Write-Host "::error::VirusTotal verdict too bad ($hits hits, big vendors: $($big -join ', ')). Not publishing. $link"
            exit 1
          }

      - name: Upload the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AionDpsMeter-${{ steps.tag.outputs.name }}
          path: releases/AionDpsMeter-${{ steps.version.outputs.channel }}-Setup.exe

      # Everything except the portable zip, which is another ~70 MB per release and duplicates
      # what the installer already carries. The index files are small but load-bearing: without
      # releases.win.json the installed app cannot see the release at all.
      - name: Attach the release files to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.tag.outputs.name }}"
          # A pushed tag without a release used to fail here ("release not found") and leave
          # installed clients with nothing to update to. Every release of this project is a
          # prerelease, so create it as one when it does not exist yet.
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease --title $tag --notes "Release $tag"
          }
          $files = Get-ChildItem releases -File | Where-Object { $_.Name -notlike '*-Portable.zip' }
          gh release upload "${{ steps.tag.outputs.name }}" $files.FullName --clobber
          # Add the VirusTotal report to the release notes (once; a re-run does not duplicate it).
          $vtLink = "${{ steps.vt.outputs.link }}"
          if ($vtLink) {
            $body = gh release view $tag --json body --jq .body
            if ($body -notmatch 'VirusTotal') {
              $line = "VirusTotal scan of the installer: ${{ steps.vt.outputs.result }} detections - $vtLink"
              gh release edit $tag --notes "$body`n`n$line"
            }
          }
          # The release stays a prerelease while the files are still being uploaded; only when
          # everything is attached does it become the normal "Latest" release (the fetch for
          # delta packages and the client's updater both still look at prereleases as well).
          # A test release (channel alpha) stays a prerelease for good and is never "Latest".
          if ("${{ steps.version.outputs.pre }}" -ne "true") {
            gh release edit $tag --prerelease=false --latest
            # Only the newest 10 stable releases are kept (deltas need the recent ones; older ones just
            # multiply the versions); older releases are deleted together with their tags. Test releases
            # are never counted and never deleted here.
            $old = gh release list --limit 200 --json tagName,createdAt,isPrerelease | ConvertFrom-Json |
              Where-Object { $_.tagName -notmatch '-' } |
              Sort-Object createdAt -Descending | Select-Object -Skip 10
            foreach ($r in $old) { gh release delete $r.tagName --cleanup-tag --yes }
          }
        shell: pwsh
