name: Build and attach MSI to release

# Runs on every "vX.Y.Z" tag push (the normal release flow) and can also be triggered
# manually for a tag that already exists (workflow_dispatch) -- needed the first time this
# workflow is added, since GitHub evaluates a tag-push trigger using the workflow file that
# existed AT that tag's commit, so tags created before this file existed never fire it on
# their own.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach the MSI to (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Derive version from tag
        id: version
        shell: bash
        run: echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ steps.tag.outputs.name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish AionSniffer (win-x64, self-contained)
        run: >
          dotnet publish AionSniffer.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false -o publish

      - name: Install WiX tool
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI
        working-directory: Packaging
        run: >
          dotnet build Installer.wixproj -c Release
          -p:PublishDir=${{ github.workspace }}\publish\
          -p:ProductVersion=${{ steps.version.outputs.number }}
          -o ${{ github.workspace }}\dist

      - name: Upload MSI as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AionDpsMeter-${{ steps.tag.outputs.name }}-msi
          path: dist/AionDpsMeter.msi

      - name: Attach MSI to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.name }}" "dist/AionDpsMeter.msi" --clobber
